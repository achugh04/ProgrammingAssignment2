# Default manim configuration for vertical "shorts" output.
# Overridable per-render via CLI flags (see render.sh).
[CLI]
# Instagram Reels / YouTube Shorts canvas: 1080 x 1920 (9:16)
pixel_width = 1080
pixel_height = 1920
frame_rate = 30

# PhysAnim-style near-black background
background_color = #0d0d12

# Output
media_dir = ./media
format = mp4
# H.264 yuv420p + faststart so the file plays on phones and uploads cleanly
movie_file_extension = .mp4

# Quality
disable_caching = False
